# Turn nature mode on every morning (e.g. after a manual evening viewing session).
# Replace the entity id with your lamp's nature mode switch
# (Settings → Entities → search "Nature mode" / "Naturmodus").
alias: "Aquarium: nature mode on in the morning"
triggers:
  - trigger: time
    at: "06:00:00"
actions:
  - action: switch.turn_on
    target:
      entity_id: switch.prime_6b9c_nature_mode
mode: single
